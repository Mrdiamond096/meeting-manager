# Dev override: hot reload + exposed ports
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  db:
    ports: ["${DB_PORT:-5432}:5432"]
  api:
    build: { target: dev }
    ports: ["3000:3000"]
    volumes: [./backend/src:/app/src]
  web:
    build: { target: dev }
    environment:
      API_URL: http://api:3000
    ports: ["3001:3001"]
    volumes: [./frontend/src:/app/src]
