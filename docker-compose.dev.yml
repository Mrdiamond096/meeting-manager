# Dev override: hot reload + exposed ports
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  db:
    ports: ["${DB_PORT:-5432}:5432"]
  api:
    build: { target: dev }
    environment:
      # Dev web runs on :3001 (prod-like on :8080); both must pass the origin guard.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3001,http://localhost:8080}
    ports: ["3000:3000"]
    # prisma too: the start command runs generate + migrate deploy, which must see the current schema and
    # migrations, not the ones baked into an older image.
    volumes: [./backend/src:/app/src, ./backend/prisma:/app/prisma]
  web:
    build: { target: dev }
    environment:
      API_URL: http://api:3000
    ports: ["3001:3001"]
    volumes: [./frontend/src:/app/src]
