# Full stack (prod-like): web (next.js) → api (express) → db (postgres)
name: meeting-manager
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meeting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meeting}
      POSTGRES_DB: ${POSTGRES_DB:-meeting}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meeting}"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  api:
    build: { context: ./backend, target: prod }
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-meeting}:${POSTGRES_PASSWORD:-meeting}@db:5432/${POSTGRES_DB:-meeting}
      APP_VERSION: ${APP_VERSION:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Local demo registration quota (max/minutes); the backend default is 3/60.
      RATE_LIMIT_REGISTER: ${RATE_LIMIT_REGISTER:-100/60}
      # Local demo only: the production image refuses the mock OTP unless explicitly allowed (ADR-009).
      OTP_PROVIDER: mock
      OTP_MOCK_CODE: ${OTP_MOCK_CODE:-112233}
      ALLOW_MOCK_OTP: "true"
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health/ready || exit 1"]
      interval: 10s
      retries: 5
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      target: prod
      args: { API_URL: http://api:3000 }
    ports: ["${WEB_PORT:-8080}:3000"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
volumes:
  db-data:
